[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "windagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3", "requests-cache>=1.2,<2", "pandas>=2.2,<4", "pyarrow>=18,<26",
  "pydantic>=2.11,<3", "pydantic-ai-slim[anthropic]>=1.0,<2", "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "responses>=0.25,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["windagent*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
